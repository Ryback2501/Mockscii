<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mockscii — Terminal Mockup Editor</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fira+Code&family=IBM+Plex+Mono&family=Inconsolata&family=JetBrains+Mono&family=Roboto+Mono&family=Source+Code+Pro&family=Space+Mono&family=Ubuntu+Mono&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/src/styles.css" />
  </head>
  <body>
    <main id="app">
      <div id="main-area">
        <header id="top-bar" data-testid="top-bar">
          <h1 class="app-title" data-testid="app-title">Mockscii</h1>
          <div id="project-control" class="project-control" data-testid="project-control"></div>
          <div id="font-control" class="font-control" data-testid="font-control"></div>
          <div id="size-control" class="size-control" data-testid="size-control"></div>
          <button
            id="guides-toggle"
            class="guides-toggle active"
            type="button"
            title="Show / hide guides (Ctrl+;)"
            aria-pressed="true"
          >
            Guides
          </button>
          <div id="toolbar" data-testid="toolbar" role="toolbar" aria-label="Tools"></div>
          <div id="io-controls" data-testid="io-controls" aria-label="Export and import"></div>
        </header>
        <section id="grid-area" aria-label="Mockup grid">
          <div id="grid-frame">
            <div id="ruler-corner"></div>
            <canvas
              id="ruler-top"
              title="Drag down to add a horizontal guide · drag a teal marker to move or remove a vertical guide"
            ></canvas>
            <canvas
              id="ruler-left"
              title="Drag right to add a vertical guide · drag a teal marker to move or remove a horizontal guide"
            ></canvas>
            <canvas id="grid" data-testid="grid"></canvas>
          </div>
        </section>
      </div>
      <aside id="side-panel" data-testid="side-panel" aria-label="Colour palette and characters">
        <div id="palette" data-testid="palette" aria-label="Colour palette"></div>
        <section
          id="glyph-selector"
          data-testid="glyph-selector"
          aria-label="Glyph selector"
        ></section>
      </aside>
    </main>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
