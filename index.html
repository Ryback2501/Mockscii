<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mockscii — Terminal Mockup Editor</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fira+Code&family=IBM+Plex+Mono&family=Inconsolata&family=JetBrains+Mono&family=Roboto+Mono&family=Source+Code+Pro&family=Space+Mono&family=Ubuntu+Mono&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/src/styles.css" />
  </head>
  <body>
    <main id="app">
      <section id="grid-area" aria-label="Mockup grid">
        <canvas id="grid" data-testid="grid"></canvas>
      </section>
      <aside id="side-panel" data-testid="side-panel" aria-label="Character selector">
        <h1 class="app-title" data-testid="app-title">Mockscii</h1>
        <div id="font-control" class="font-control" data-testid="font-control"></div>
        <div id="toolbar" data-testid="toolbar" role="toolbar" aria-label="Tools"></div>
        <div id="palette" data-testid="palette" aria-label="Colour palette"></div>
        <section id="glyph-selector" data-testid="glyph-selector" aria-label="Glyph selector"></section>
      </aside>
    </main>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
